name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest, SQL y UAT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar módulos
        run: |
          python -m compileall -q 05-core-middleware 06-mensajeria 07-aml-compliance 08-qa-uat 09-analitica

      - name: Generar base sintética reproducible
        run: |
          python 05-core-middleware/scripts/seed.py --db 05-core-middleware/db/novabank.db

      - name: Ejecutar pytest, UAT y controles SQL
        run: |
          python 08-qa-uat/scripts/run_uat.py --db 05-core-middleware/db/novabank.db

      - name: Resumen de resultados
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("08-qa-uat/resultados/resultados-uat.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              summary = data["summary"]
              print(f"Casos: {summary['cases_total']}")
              print(f"Automatizados aprobados: {summary['automated_passed']}/{summary['automated_total']}")
              print(f"Manuales pendientes: {summary['manual_pending']}")
              print(f"No implementados: {summary['not_implemented']}")
              print(f"pytest: {data['pytest']['passed']}/{data['pytest']['total']}")
          else:
              print("No se generó resultados-uat.json")
          PY

      - name: Publicar artefactos QA/UAT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-uat-results
          path: 08-qa-uat/
          if-no-files-found: warn

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: 08-qa-uat/resultados/junit-uat.xml
          if-no-files-found: warn
