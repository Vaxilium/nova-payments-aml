goe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Escalar a caso</text><text x="400" y="380" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4B5563" text-anchor="start">Requiere investigación ampliada o aprobación de otro nivel.</text><rect x="362" y="402" width="716" height="48" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><circle cx="382" cy="426" r="8" fill="#FFFFFF" stroke="#155E8A" stroke-width="1"/><text x="400" y="422" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Reportar ROS</text><text x="400" y="438" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="400" fill="#4B5563" text-anchor="start">Existe sospecha fundamentada que debe reportarse.</text><text x="362" y="472" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Motivo del cierre *</text><rect x="362" y="482" width="716" height="92" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="376" y="504" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">La actividad es consistente con el giro declarado. Se verificó</text><text x="376" y="522" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">el origen de fondos y la documentación del cliente. No se</text><text x="376" y="540" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">identifican operaciones adicionales fuera del perfil.</text><text x="1062" y="558" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="9" font-weight="400" fill="#4B5563" text-anchor="end">186/1.000</text><text x="362" y="600" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Checklist de cierre *</text><text x="362" y="622" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#111827" text-anchor="start">☑ Se revisaron todas las alertas vinculadas</text><text x="362" y="644" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#111827" text-anchor="start">☑ Se verificó el origen de fondos y la documentación KYC</text><text x="362" y="666" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#111827" text-anchor="start">☑ Se dejó constancia del análisis en las notas del caso</text><rect x="362" y="686" width="716" height="44" rx="6" fill="#DBEAFE"/><text x="376" y="711" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="start">Al confirmar, el caso quedará CERRADO y no podrá reabrirse.</text><rect x="760" y="748" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#155E8A" stroke-width="1"/><text x="835.0" y="773.0" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#155E8A" text-anchor="middle">Cancelar</text><rect x="920" y="748" width="158" height="40" rx="8" fill="#B91C1C"/><text x="999.0" y="773.0" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirmar cierre</text></svg>